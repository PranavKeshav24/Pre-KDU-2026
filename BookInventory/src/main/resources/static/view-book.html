<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --success: #10b981;
        --success-bg: #d1fae5;
        --danger: #ef4444;
        --danger-bg: #fee2e2;
        --gray-50: #f9fafb;
        --gray-100: #f3f4f6;
        --gray-200: #e5e7eb;
        --gray-300: #d1d5db;
        --gray-400: #9ca3af;
        --gray-500: #6b7280;
        --gray-600: #4b5563;
        --gray-700: #374151;
        --gray-800: #1f2937;
        --gray-900: #111827;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1),
          0 4px 6px -4px rgb(0 0 0 / 0.1);
        --radius: 12px;
        --radius-sm: 8px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
        min-height: 100vh;
        color: var(--gray-800);
        line-height: 1.6;
        padding: 40px 24px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--gray-600);
        text-decoration: none;
        font-weight: 500;
        margin-bottom: 24px;
        transition: color 0.15s ease;
      }

      .back-link:hover {
        color: var(--primary);
      }

      .card {
        background: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
        border: 1px solid var(--gray-200);
      }

      .card-header {
        padding: 24px 32px;
        border-bottom: 1px solid var(--gray-100);
        background: var(--gray-50);
      }

      .card-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--gray-900);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .card-body {
        padding: 32px;
      }

      .search-box {
        display: flex;
        gap: 12px;
      }

      input {
        flex: 1;
        padding: 14px 18px;
        border: 1px solid var(--gray-300);
        border-radius: var(--radius-sm);
        font-size: 1rem;
        font-family: inherit;
        color: var(--gray-800);
        transition: all 0.15s ease;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      }

      input::placeholder {
        color: var(--gray-400);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 24px;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        transition: all 0.15s ease;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .book-details {
        margin-top: 32px;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .book-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--gray-100);
      }

      .book-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--gray-900);
        margin-bottom: 4px;
      }

      .book-author {
        color: var(--gray-500);
        font-size: 1rem;
      }

      .book-price {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--success);
      }

      .details-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .detail-item {
        padding: 16px;
        background: var(--gray-50);
        border-radius: var(--radius-sm);
      }

      .detail-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--gray-500);
        font-weight: 600;
        margin-bottom: 4px;
      }

      .detail-value {
        font-size: 1rem;
        color: var(--gray-800);
        font-weight: 500;
      }

      .detail-value.mono {
        font-family: "SF Mono", Monaco, monospace;
        font-size: 0.9rem;
      }

      .category-badge {
        display: inline-block;
        padding: 4px 12px;
        background: var(--primary);
        color: white;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
        text-transform: capitalize;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--gray-100);
      }

      .btn-edit {
        flex: 1;
        background: var(--gray-100);
        color: var(--gray-700);
      }

      .btn-edit:hover {
        background: var(--primary);
        color: white;
      }

      .btn-delete {
        flex: 1;
        background: var(--gray-100);
        color: var(--gray-700);
      }

      .btn-delete:hover {
        background: var(--danger);
        color: white;
      }

      .error-message {
        margin-top: 24px;
        padding: 16px 20px;
        background: var(--danger-bg);
        border: 1px solid var(--danger);
        color: #991b1b;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .success-message {
        margin-top: 24px;
        padding: 16px 20px;
        background: var(--success-bg);
        border: 1px solid var(--success);
        color: #065f46;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      @media (max-width: 640px) {
        body {
          padding: 24px 16px;
        }

        .card-body {
          padding: 24px;
        }

        .search-box {
          flex-direction: column;
        }

        .details-grid {
          grid-template-columns: 1fr;
        }

        .book-header {
          flex-direction: column;
          gap: 16px;
        }

        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="/" class="back-link">← Back to Book List</a>

      <div class="card">
        <div class="card-header">
          <h1>🔍 Find Book</h1>
        </div>
        <div class="card-body">
          <div class="search-box">
            <input id="id" placeholder="Enter book ID" type="number" min="1" />
            <button class="btn btn-primary" id="btn">Search</button>
          </div>
          <div id="out"></div>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("btn").addEventListener("click", findBook);
      document.getElementById("id").addEventListener("keypress", (e) => {
        if (e.key === "Enter") findBook();
      });

      async function findBook() {
        const id = document.getElementById("id").value;
        if (!id) return;

        try {
          const res = await fetch("/api/books/" + encodeURIComponent(id));
          const body = await res.json();

          if (res.ok) {
            const categoryDisplay = body.category
              ? body.category.replace("_", " ").toLowerCase()
              : null;
            const createdDate = body.createdAt
              ? new Date(body.createdAt).toLocaleDateString("en-US", {
                  year: "numeric",
                  month: "long",
                  day: "numeric",
                  hour: "2-digit",
                  minute: "2-digit",
                })
              : "N/A";
            const updatedDate = body.updatedAt
              ? new Date(body.updatedAt).toLocaleDateString("en-US", {
                  year: "numeric",
                  month: "long",
                  day: "numeric",
                  hour: "2-digit",
                  minute: "2-digit",
                })
              : "Never";

            document.getElementById("out").innerHTML = `
              <div class="book-details">
                <div class="book-header">
                  <div>
                    <div class="book-title">${body.title || "Untitled"}</div>
                    <div class="book-author">by ${
                      body.author || "Unknown Author"
                    }</div>
                  </div>
                  <div class="book-price">$${
                    body.price ? body.price.toFixed(2) : "0.00"
                  }</div>
                </div>
                <div class="details-grid">
                  <div class="detail-item">
                    <div class="detail-label">Book ID</div>
                    <div class="detail-value">#${body.id}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">ISBN</div>
                    <div class="detail-value mono">${body.isbn || "N/A"}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">Publisher</div>
                    <div class="detail-value">${body.publisher || "N/A"}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">Published Year</div>
                    <div class="detail-value">${
                      body.publishedYear || "N/A"
                    }</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">Category</div>
                    <div class="detail-value">${
                      categoryDisplay
                        ? `<span class="category-badge">${categoryDisplay}</span>`
                        : "N/A"
                    }</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">Created</div>
                    <div class="detail-value">${createdDate}</div>
                  </div>
                </div>
                <div class="actions">
                  <button class="btn btn-edit" onclick="editBook(${
                    body.id
                  })">✏️ Edit Book</button>
                  <button class="btn btn-delete" onclick="deleteBook(${
                    body.id
                  })">🗑️ Delete Book</button>
                </div>
              </div>
            `;
          } else {
            document.getElementById(
              "out"
            ).innerHTML = `<div class="error-message">❌ ${
              body.message || "Book not found"
            }</div>`;
          }
        } catch (err) {
          document.getElementById(
            "out"
          ).innerHTML = `<div class="error-message">❌ Error: ${err.message}</div>`;
        }
      }

      function editBook(id) {
        window.location.href = `/add-book.html?id=${id}`;
      }

      async function deleteBook(id) {
        if (!confirm("Are you sure you want to delete this book?")) return;

        try {
          const res = await fetch(`/api/books/${id}`, { method: "DELETE" });
          if (res.ok) {
            document.getElementById("out").innerHTML =
              '<div class="success-message">✅ Book deleted successfully!</div>';
            document.getElementById("id").value = "";
          } else {
            const error = await res.json();
            alert("Error deleting book: " + (error.message || "Unknown error"));
          }
        } catch (err) {
          alert("Error deleting book: " + err.message);
        }
      }
    </script>
  </body>
</html>
